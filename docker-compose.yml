services:
  bot:
    build: .
    container_name: mgkap_schedule_bot
    env_file: .env
    volumes:
      # Keep the SQLite database and its WAL sidecars in one durable directory.
      - ./data:/data
      - ./schedules:/app/schedules
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - schedule-bot
    restart: unless-stopped

networks:
  schedule-bot:
    name: mgkap-schedule
